services:
  postgres:
    image: postgres:16-alpine
    container_name: ufw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ufw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ufw}
      POSTGRES_DB: ufw
    volumes:
      - ufw_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ufw -d ufw"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: ufw-migrate
    environment:
      DATABASE_URL: postgresql://ufw:${POSTGRES_PASSWORD:-ufw}@postgres:5432/ufw?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:3000}
    container_name: ufw-app
    restart: unless-stopped
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://ufw:${POSTGRES_PASSWORD:-ufw}@postgres:5432/ufw?schema=public
      BETTER_AUTH_URL: ${APP_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required}
      NODE_ENV: production
      LOG_LEVEL: info
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  ufw_postgres_data:
