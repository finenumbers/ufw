# Portainer stack — production behind existing Nginx Proxy Manager.
# NPM is NOT part of this stack.
#
# Deploy:
#   1. Set secrets in Portainer env (or copy .env.production.example).
#   2. Portainer → Stacks → Add stack → Web editor → paste this file.
#   3. Configure NPM Proxy Host: ufw-app:8088, WebSockets ON, Force SSL.
#
# Images are pinned in this file as :latest (updated on each GitHub release).
# Redeploy: Update the stack with "Pull latest image" — no image env vars needed.
# To pin a version temporarily, edit the two image: lines below (e.g. :v0.2.3).
#
# See docs/en/deployment/portainer.md

name: ufw-remote-manager

services:
  postgres:
    image: postgres:16-alpine
    container_name: ufw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ufw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ufw
    volumes:
      - ufw_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ufw -d ufw"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    image: ghcr.io/finenumbers/ufw-remote-manager-migrate:latest
    container_name: ufw-migrate
    environment:
      DATABASE_URL: postgresql://ufw:${POSTGRES_PASSWORD}@postgres:5432/ufw?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    image: ghcr.io/finenumbers/ufw-remote-manager:latest
    container_name: ufw-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://ufw:${POSTGRES_PASSWORD}@postgres:5432/ufw?schema=public
      APP_URL: ${APP_URL:?APP_URL is required}
      BETTER_AUTH_URL: ${APP_URL:?APP_URL is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required}
      PORT: 8088
      NODE_ENV: production
      LOG_LEVEL: info
      PORT_SCAN_ENABLED: ${PORT_SCAN_ENABLED:-false}
      DOCKER_MONITOR_ENABLED: ${DOCKER_MONITOR_ENABLED:-false}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8088/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - default
      - npm_proxy

networks:
  npm_proxy:
    external: true
    name: ${NPM_NETWORK:?NPM_NETWORK is required}

volumes:
  ufw_postgres_data:
