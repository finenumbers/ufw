# Portainer stack — production behind existing Nginx Proxy Manager.
# NPM is NOT part of this stack.
#
# Deploy:
#   1. Copy .env.production.example → set secrets on the host (or Portainer env UI).
#   2. Portainer → Stacks → Add stack → Web editor → paste this file.
#   3. Set all required environment variables in Portainer (never commit real values to git).
#   4. Configure NPM Proxy Host: ufw-app:3000, WebSockets ON, Force SSL.
#
# See docs/deploy/portainer.md

name: ufw-remote-manager

services:
  postgres:
    image: postgres:16-alpine
    container_name: ufw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ufw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ufw
    volumes:
      - ufw_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ufw -d ufw"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    image: ${GHCR_MIGRATE_IMAGE:?GHCR_MIGRATE_IMAGE is required}
    container_name: ufw-migrate
    environment:
      DATABASE_URL: postgresql://ufw:${POSTGRES_PASSWORD}@postgres:5432/ufw?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    image: ${GHCR_APP_IMAGE:?GHCR_APP_IMAGE is required}
    container_name: ufw-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://ufw:${POSTGRES_PASSWORD}@postgres:5432/ufw?schema=public
      APP_URL: ${APP_URL:?APP_URL is required}
      BETTER_AUTH_URL: ${APP_URL:?APP_URL is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required}
      NODE_ENV: production
      LOG_LEVEL: info
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - default
      - npm_proxy

networks:
  npm_proxy:
    external: true
    name: ${NPM_NETWORK:?NPM_NETWORK is required}

volumes:
  ufw_postgres_data:
