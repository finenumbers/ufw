# Production override for deployment behind an EXISTING Nginx Proxy Manager (NPM).
# NPM is NOT part of this stack — it must already be running on the host.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Prerequisites:
#   1. Set NPM_NETWORK in .env to the Docker network name NPM already uses.
#   2. Configure a Proxy Host in NPM UI: Forward Hostname=ufw-app, Port=8088, Scheme=http.
#   3. Set APP_URL in .env to the public HTTPS URL exposed by NPM.
#   4. Full guide: docs/en/deployment/nginx-proxy-manager.md

services:
  postgres:
    ports: !reset []

  app:
    ports: !reset []
    networks:
      - default
      - npm_proxy

networks:
  npm_proxy:
    external: true
    name: ${NPM_NETWORK:?NPM_NETWORK is required for production deploy behind NPM}
