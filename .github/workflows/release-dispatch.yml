name: Release (dispatch)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish (e.g. v1.0.0-prod or sha-abc1234)
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image names
        run: |
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "APP_IMAGE=${{ env.REGISTRY }}/${OWNER}/ufw-remote-manager" >> "$GITHUB_ENV"
          echo "MIGRATE_IMAGE=${{ env.REGISTRY }}/${OWNER}/ufw-remote-manager-migrate" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:${{ inputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: |
            ${{ env.MIGRATE_IMAGE }}:${{ inputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Images published

          | Variable | Value |
          |----------|-------|
          | \`GHCR_APP_IMAGE\` | \`${{ env.APP_IMAGE }}:${{ inputs.image_tag }}\` |
          | \`GHCR_MIGRATE_IMAGE\` | \`${{ env.MIGRATE_IMAGE }}:${{ inputs.image_tag }}\` |

          Set \`APP_URL\` in your server \`.env\` to the public HTTPS URL from NPM.

          Deploy with Portainer or:
          \`\`\`bash
          docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.ghcr.yml --env-file .env up -d
          \`\`\`
          EOF
