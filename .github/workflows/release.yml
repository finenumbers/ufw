name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm test

      - name: i18n check
        run: npm run i18n:check

      - name: Docs check
        run: npm run docs:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ufw:ufw@localhost:5432/ufw?schema=public

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image names
        run: |
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "APP_IMAGE=${{ env.REGISTRY }}/${OWNER}/ufw-remote-manager" >> "$GITHUB_ENV"
          echo "MIGRATE_IMAGE=${{ env.REGISTRY }}/${OWNER}/ufw-remote-manager-migrate" >> "$GITHUB_ENV"
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          build-args: |
            APP_VERSION=${{ env.VERSION }}
            BUILD_SHA=${{ github.sha }}
          tags: |
            ${{ env.APP_IMAGE }}:${{ github.ref_name }}
            ${{ env.APP_IMAGE }}:${{ env.VERSION }}
            ${{ env.APP_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: |
            ${{ env.MIGRATE_IMAGE }}:${{ github.ref_name }}
            ${{ env.MIGRATE_IMAGE }}:${{ env.VERSION }}
            ${{ env.MIGRATE_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Published images

          | Image | Tags |
          |-------|------|
          | \`${{ env.APP_IMAGE }}\` | \`${{ github.ref_name }}\`, \`${{ env.VERSION }}\`, \`latest\` |
          | \`${{ env.MIGRATE_IMAGE }}\` | \`${{ github.ref_name }}\`, \`${{ env.VERSION }}\`, \`latest\` |

          Set \`APP_URL\` in your server \`.env\` to the public HTTPS URL from NPM. One image works for any domain.
          EOF
