# Pull pre-built images from GitHub Container Registry (GHCR).
#
# Defaults: ghcr.io/finenumbers/ufw-remote-manager:latest (see Release workflow).
# Optional in .env: GHCR_OWNER, GHCR_IMAGE_TAG (pin e.g. v0.2.1 for rollback).
#
# Usage (production behind NPM):
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.prod.yml \
#     -f docker-compose.ghcr.yml \
#     --env-file .env \
#     pull && up -d

services:
  migrate:
    build: !reset null
    image: ghcr.io/${GHCR_OWNER:-finenumbers}/ufw-remote-manager-migrate:${GHCR_IMAGE_TAG:-latest}

  app:
    build: !reset null
    image: ghcr.io/${GHCR_OWNER:-finenumbers}/ufw-remote-manager:${GHCR_IMAGE_TAG:-latest}
